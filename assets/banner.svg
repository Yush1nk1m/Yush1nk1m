<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" role="img"
     aria-label="Design, Documentation, and Development — Yushin Kim, Backend Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1A2B"/>
      <stop offset="1" stop-color="#0E2233"/>
    </linearGradient>
    <linearGradient id="wire" gradientUnits="userSpaceOnUse" x1="150" y1="150" x2="730" y2="150">
      <stop offset="0"   stop-color="#4FB0E0"/>
      <stop offset="0.5" stop-color="#54C2A0"/>
      <stop offset="1"   stop-color="#6DB33F"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16324B" stroke-width="1" opacity="0.5"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- frame -->
  <rect x="1" y="1" width="878" height="238" rx="16" fill="url(#bg)" stroke="#1B3A5C" stroke-width="1"/>
  <rect x="1" y="1" width="878" height="238" rx="16" fill="url(#grid)"/>

  <!-- eyebrow -->
  <text x="56" y="52" fill="#6E92AC"
        font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace"
        font-size="13" letter-spacing="4">YUSHIN&#160;KIM&#160;&#160;·&#160;&#160;BACKEND&#160;ENGINEER</text>
  <line x1="56" y1="64" x2="170" y2="64" stroke="#4FB0E0" stroke-width="2"
        stroke-dasharray="114" stroke-dashoffset="114">
    <animate attributeName="stroke-dashoffset" from="114" to="0" dur="0.7s" begin="0.1s" fill="freeze"/>
  </line>

  <!-- pipeline wire (draws in) -->
  <path id="wirePath" d="M150 150 H730" fill="none" stroke="url(#wire)" stroke-width="2.5"
        stroke-linecap="round" stroke-dasharray="580" stroke-dashoffset="580">
    <animate attributeName="stroke-dashoffset" from="580" to="0" dur="1.1s" begin="0.5s" fill="freeze"/>
  </path>

  <!-- traveling pulse (loops after wire is drawn) -->
  <circle r="5" fill="#9FE6FF" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.6s" begin="2s" repeatCount="indefinite"/>
    <animateMotion dur="2.6s" begin="2s" repeatCount="indefinite" path="M150 150 H730"/>
  </circle>

  <!-- node group: DESIGN -->
  <g>
    <circle cx="150" cy="150" r="0" fill="#0B1A2B" stroke="#4FB0E0" stroke-width="2.5">
      <animate attributeName="r" values="0;13;9" keyTimes="0;0.7;1" dur="0.5s" begin="1.0s" fill="freeze"/>
    </circle>
    <circle cx="150" cy="150" r="0" fill="#4FB0E0">
      <animate attributeName="r" values="0;3.5" dur="0.4s" begin="1.15s" fill="freeze"/>
    </circle>
    <text x="150" y="195" text-anchor="middle" fill="#EAF2F8" opacity="0"
          font-family="'Inter',system-ui,-apple-system,'Segoe UI',sans-serif"
          font-size="20" font-weight="700" letter-spacing="1">DESIGN
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.2s" fill="freeze"/>
    </text>
    <text x="150" y="213" text-anchor="middle" fill="#6E92AC" opacity="0"
          font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="11" letter-spacing="2">01
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.2s" fill="freeze"/>
    </text>
  </g>

  <!-- node group: DOCUMENT -->
  <g>
    <circle cx="440" cy="150" r="0" fill="#0B1A2B" stroke="#54C2A0" stroke-width="2.5">
      <animate attributeName="r" values="0;13;9" keyTimes="0;0.7;1" dur="0.5s" begin="1.3s" fill="freeze"/>
    </circle>
    <circle cx="440" cy="150" r="0" fill="#54C2A0">
      <animate attributeName="r" values="0;3.5" dur="0.4s" begin="1.45s" fill="freeze"/>
    </circle>
    <text x="440" y="195" text-anchor="middle" fill="#EAF2F8" opacity="0"
          font-family="'Inter',system-ui,-apple-system,'Segoe UI',sans-serif"
          font-size="20" font-weight="700" letter-spacing="1">DOCUMENTATION
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.5s" fill="freeze"/>
    </text>
    <text x="440" y="213" text-anchor="middle" fill="#6E92AC" opacity="0"
          font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="11" letter-spacing="2">02
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.5s" fill="freeze"/>
    </text>
  </g>

  <!-- node group: DEVELOP -->
  <g>
    <circle cx="730" cy="150" r="0" fill="#0B1A2B" stroke="#6DB33F" stroke-width="2.5">
      <animate attributeName="r" values="0;13;9" keyTimes="0;0.7;1" dur="0.5s" begin="1.6s" fill="freeze"/>
    </circle>
    <circle cx="730" cy="150" r="0" fill="#6DB33F">
      <animate attributeName="r" values="0;3.5" dur="0.4s" begin="1.75s" fill="freeze"/>
    </circle>
    <text x="730" y="195" text-anchor="middle" fill="#EAF2F8" opacity="0"
          font-family="'Inter',system-ui,-apple-system,'Segoe UI',sans-serif"
          font-size="20" font-weight="700" letter-spacing="1">DEVELOPMENT
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.8s" fill="freeze"/>
    </text>
    <text x="730" y="213" text-anchor="middle" fill="#6E92AC" opacity="0"
          font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="11" letter-spacing="2">03
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.8s" fill="freeze"/>
    </text>
  </g>

  <!-- mono caption bottom-right -->
  <text x="824" y="52" text-anchor="end" fill="#6E92AC" opacity="0"
        font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="11" letter-spacing="1">// DDD: Problem-Solving Framework
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.0s" fill="freeze"/>
  </text>
</svg>
