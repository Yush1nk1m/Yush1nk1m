<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 200" role="img" aria-label="Basetalk — KBO 야구 실시간 예측과 팬 채팅 서비스">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1A2B"/><stop offset="1" stop-color="#0E2233"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#16324B" stroke-width="1" opacity="0.45"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="288" height="198" rx="14" fill="url(#bg)" stroke="#1B3A5C"/>
  <rect x="1" y="1" width="288" height="198" rx="14" fill="url(#grid)"/>
  <!-- left accent edge -->
  <rect x="1" y="1" width="4" height="198" rx="2" fill="#54C2A0"/>
  <!-- node dot + glow -->
  <circle cx="28" cy="40" r="9" fill="none" stroke="#54C2A0" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="28" cy="40" r="4" fill="#54C2A0" filter="url(#glow)"/>
  <!-- title -->
  <text x="46" y="46" fill="#EAF2F8" font-family="'Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="700" letter-spacing="0.3">Basetalk</text>
  <!-- external-link hint -->
  <text x="266" y="38" text-anchor="end" fill="#54C2A0" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="13" font-weight="700">&#8599;</text>
  <!-- underline -->
  <line x1="24" y1="64" x2="76" y2="64" stroke="#54C2A0" stroke-width="2"/>
  <!-- description (2 lines, simple service intro) -->
  <text x="24" y="98"  fill="#A9C2D6" font-family="'Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5">KBO 야구 실시간 예측과</text>
  <text x="24" y="120" fill="#A9C2D6" font-family="'Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5">팬 채팅 서비스</text>
  <!-- tech pills -->
  <g>
    <rect x="24" y="158" width="56" height="22" rx="11" fill="none" stroke="#E0608A" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="35" cy="169" r="2.5" fill="#E0608A"/>
    <text x="43" y="173" fill="#C4D6E4" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="10" letter-spacing="0.3">NestJS</text>
  </g>
  <g>
    <rect x="88" y="158" width="82" height="22" rx="11" fill="none" stroke="#4FB0E0" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="99" cy="169" r="2.5" fill="#4FB0E0"/>
    <text x="107" y="173" fill="#C4D6E4" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="10" letter-spacing="0.3">PostgreSQL</text>
  </g>
  <g>
    <rect x="178" y="158" width="69" height="22" rx="11" fill="none" stroke="#E8913A" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="189" cy="169" r="2.5" fill="#E8913A"/>
    <text x="197" y="173" fill="#C4D6E4" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="10" letter-spacing="0.3">RabbitMQ</text>
  </g>
</svg>
